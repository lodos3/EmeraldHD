name: Build Trainer Nexus APK
on:
  push:
    branches: [ trainer-nexus-apk-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle -p trainer-nexus --no-daemon clean :app:assembleDebug
      - name: Verify and stage APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs trainer-nexus/app/build/outputs/apk/debug/app-debug.apk
          cp trainer-nexus/app/build/outputs/apk/debug/app-debug.apk Trainer-Nexus-0.1.apk
          sha256sum Trainer-Nexus-0.1.apk > Trainer-Nexus-0.1.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Trainer-Nexus-0.1
          path: |
            Trainer-Nexus-0.1.apk
            Trainer-Nexus-0.1.apk.sha256
          if-no-files-found: error
